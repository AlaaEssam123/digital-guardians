<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حراس العالم الرقمي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#4a3560;--or:#f08a4b;--pu:#8e6bd6;--gr:#4fbf93;--cd:rgba(255,251,242,.95);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fde9c9 center/cover fixed;min-height:100vh;font-size:18px}
#hud{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:rgba(255,246,230,.9);backdrop-filter:blur(6px)}
#hud .sp{flex:1}
.chip{background:#fff;border-radius:20px;padding:5px 12px;font-weight:700;box-shadow:0 3px 0 #e6cfae;font-size:15px}
.ib{border:0;background:#fff;border-radius:14px;font-size:20px;padding:5px 10px;box-shadow:0 3px 0 #e6cfae;cursor:pointer}
#app{max-width:880px;margin:0 auto;padding:78px 12px 30px;opacity:0}
#app.in{animation:in .45s forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border-radius:26px;padding:18px;box-shadow:0 8px 0 rgba(200,160,110,.5),0 14px 30px rgba(120,80,40,.18);margin-bottom:14px}
h1{font-size:clamp(34px,8vw,56px);margin:6px 0;color:var(--pu);text-shadow:0 3px 0 #fff,0 6px 0 rgba(142,107,214,.25)}
h2{margin:4px 0 10px;color:var(--pu)}h3{margin:4px 0}
.center{text-align:center}
.btn{font:inherit;font-weight:800;font-size:20px;color:#fff;background:var(--or);border:0;border-radius:20px;padding:12px 26px;box-shadow:0 6px 0 #c4631f;cursor:pointer;transition:transform .12s,box-shadow .12s;margin:6px}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c4631f}
.btn.pu{background:var(--pu);box-shadow:0 6px 0 #5f43a3}.btn.gr{background:var(--gr);box-shadow:0 6px 0 #2f8f6a}.btn.no{background:#e8695f;box-shadow:0 6px 0 #b13f37}.btn.big{font-size:28px;padding:20px 38px}
.owlbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.owl{height:clamp(110px,22vw,160px);animation:fl 2.4s ease-in-out infinite}.owl.pop{animation:pop .5s,fl 2.4s 0.5s ease-in-out infinite}
.owl-big{height:clamp(200px,38vh,330px);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-9px) rotate(-2deg)}}
@keyframes pop{40%{transform:scale(1.2) rotate(5deg)}}
.bub{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-weight:700;flex:1;box-shadow:0 4px 0 #e6cfae}
.bub:before{content:"";position:absolute;right:-10px;top:40%;border:10px solid transparent;border-left-color:#fff;border-right:0}
.hero{padding-top:6px}
.hero p{font-size:22px;font-weight:700;background:var(--cd);display:inline-block;border-radius:18px;padding:8px 18px}
input{font:inherit;font-size:22px;padding:12px 16px;border-radius:18px;border:3px solid var(--pu);width:min(380px,92%);text-align:center;color:var(--ink);background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:#fff;border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 #e6cfae}.st b{display:block;font-size:28px;color:var(--or)}
.pbar,.bar{height:18px;background:#eadcf5;border-radius:12px;overflow:hidden}.pbar i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),#9be28a);border-radius:12px;transition:width .5s}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.lv{background:#fff;border-radius:24px;padding:12px;text-align:center;box-shadow:0 7px 0 #e1c9a6;cursor:pointer;transition:transform .15s;position:relative;font-size:16px}
.lv:hover{transform:translateY(-5px) rotate(-1deg)}.lv img{height:120px;max-width:100%;object-fit:contain}
.lv.lock{filter:grayscale(.9);opacity:.6;cursor:not-allowed}.lv.lock:hover{transform:none}
.lv.done{box-shadow:0 7px 0 #4fbf93}
.tag{display:inline-block;border-radius:14px;padding:3px 12px;font-weight:800;font-size:14px;background:#ffe3c7}
.tag.g{background:#c8f1de}.tag.l{background:#ddd}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:92px;margin:4px;font-size:13px;font-weight:700}.badge span{font-size:38px;background:#fff;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #e6cfae}.badge.off{filter:grayscale(1);opacity:.4}
.pic{display:block;margin:0 auto 8px;max-height:200px;max-width:90%}
.slide{font-size:21px;line-height:1.9}
.tmr{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}.tmr .bar{flex:1}.tmr.warn #tt{color:#e8372f;animation:fl .5s infinite}.tmr.warn .bar i{background:#e8695f}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:20px;text-align:right;background:#fff;color:var(--ink);border:3px solid #d9c6f0;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #d9c6f0;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}.opt b{background:var(--pu);color:#fff;border-radius:50%;padding:2px 10px;margin-inline-end:8px}
.opt.right{background:#c8f1de;border-color:var(--gr);animation:pop .5s}.opt.wrong{background:#ffd3cf;border-color:#e8695f;animation:sh .4s}.opt.sel{border-color:var(--or);background:#fff1e0}
.tfrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.tfrow .btn.right{outline:6px solid #b8ecd3}.tfrow .btn.wrong{opacity:.5}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:grid;gap:10px;align-content:start}.opt.m{font-size:16px;padding:10px}
.fb{margin-top:14px;border-radius:20px;padding:14px;text-align:center;animation:in .4s}.fb.good{background:#d7f5e6}.fb.bad{background:#fde4c8}
.locked{pointer-events:none}
.rules div{padding:3px 0}.rules .ok{color:#1f9a68;font-weight:800}
.meter{height:14px;background:#eadcf5;border-radius:10px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:0;background:#e8695f;transition:.3s}
.p{position:fixed;width:38px;z-index:50;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(480deg)}}
.cert{background:#fffdf5;border:12px double #d9a441;border-radius:10px;padding:26px 16px;text-align:center;position:relative;color:#4a3560}
.cert h1{color:#b9822a;font-size:clamp(30px,7vw,52px)}.cert .nm{font-size:clamp(30px,7vw,48px);font-weight:900;color:var(--pu);border-bottom:3px dotted #d9a441;display:inline-block;padding:0 24px;margin:8px 0}
.cert img{height:120px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff!important}body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;inset:0 0 auto 0;width:100%}}
</style>
</head>

function nextQ(){snd('clk');qi++;qi<L[ci].qs.length?ask():lvEnd()}
function lvEnd(){const v=S.lv[ci],l=L[ci];v.p=v.s>=l.pass?1:0;save();hud();const ps=v.p;snd(ps?'bdg':'bad');if(ps)burst(26);
show(`<div class="card center">${owlBar(ps?'s':'x',ps?'مذهل! اجتزت المستوى!':'اقتربت! تحتاج '+l.pass+' نقطة على الأقل. حاول مرة أخرى!')}<h2>${ps?'🎉 نجحت في ':'نتيجة '}${l.n}</h2><div class=st style="max-width:260px;margin:auto">نقاطك<b>${v.s} / ${mx(ci)}</b>حد النجاح ${l.pass}</div><p>✅ ${v.c} صحيحة &nbsp; ❌ ${v.w} خاطئة</p>${ps?`<div class=badge style="width:140px"><span style="font-size:60px;width:100px;height:100px">${l.e}</span>شارة ${l.b}</div>`:''}<div>${ps?(ci==3?'<button class="btn gr" onclick="final()">🏆 النتيجة النهائية</button>':`<button class="btn gr" onclick="snd('lvl');mapScr()">🗺️ المستوى التالي</button>`):`<button class=btn onclick="startLv(${ci})">🔄 أعد المحاولة</button><button class="btn pu" onclick="learn(${ci},0)">📖 راجع الشرح</button>`}<button class="btn pu" onclick="dash()">📊 لوحتي</button></div></div>`)}
function final(){if(!S)return;const p=pct(),m=p>=90?'أداء أسطوري! أنت حارس رقمي حقيقي 🌟':p>=75?'عمل رائع! واصل حماية عالمك الرقمي 💪':'أحسنت! حاول تحسين نتيجتك لتصبح حارسًا خارقًا 😊';snd('win');burst(40);
show(`<div class="card center">${owlBar('s','مبروك يا '+esc(S.n)+'! أنت الحارس الرقمي الخارق!')}<img class=pic style="max-height:230px" src="${IMG.cup}" alt="الكأس"><h1>🏆 الحارس الرقمي الخارق</h1><div class=grid><div class=st>⭐ النقاط<b>${tot()}/${MAX}</b></div><div class=st>📈 الإنجاز<b>${p}%</b></div><div class=st>✅ صحيحة<b>${sum('c')}</b></div><div class=st>❌ خاطئة<b>${sum('w')}</b></div></div><p style="font-weight:800">${m}</p><div>${badges()}</div><p>المستويات المجتازة: ${S.lv.filter(v=>v.p).length}/4</p><button class="btn gr" onclick="cert()">📜 شهادة التقدير</button><button class=btn onclick="again()">🔄 العب من جديد</button><button class="btn pu" onclick="dash()">📊 لوحتي</button></div>`)}
function again(){if(confirm('هل تريد بدء اللعبة من جديد؟ ستُمسح نتائجك الحالية.')){S=fresh(S.n);save();hud();dash()}}
function cert(){snd('bdg');show(`<div class=card><div class=cert id=cert><img src="${IMG.cup}" alt=""><h1>شهادة تقدير</h1><p>تتشرف لعبة <b>حراس العالم الرقمي</b> بمنح البطل</p><div class=nm>${esc(S.n)}</div><p>هذه الشهادة تقديرًا لإتمامه المغامرة بنجاح واجتيازه المستويات الأربعة في الأمان الرقمي، وحصوله على لقب <b>الحارس الرقمي الخارق</b>.</p><p style="font-size:22px;font-weight:800">مجموع النقاط: ${tot()} من ${MAX} (${pct()}%)</p><p>${S.lv.map((v,i)=>L[i].e+' '+L[i].b).join(' &nbsp; ')}</p><p>التاريخ: ${new Date().toLocaleDateString('ar-EG')}</p><img src="${IMG.owl1}" alt=""></div><div class=center><button class="btn gr" onclick="window.print()">🖨️ اطبع الشهادة</button><button class="btn pu" onclick="final()">رجوع</button></div></div>`)}
document.body.style.backgroundImage=`url(${IMG.bg})`;
start();
</script>
</body>
</html>
